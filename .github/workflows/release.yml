name: Release

# Publica uma release sozinho: quando o main recebe um VERSION que ainda não tem release,
# compila o .exe, cria a tag vX.Y.Z nesse commit e publica. Enviar uma tag na mão também funciona.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versão a publicar
        id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (python -X utf8 driverprecision.py --version).Split(' ')[-1]
          $tag = "v$v"
          if ("${{ github.ref_type }}" -eq "tag" -and $tag -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} difere de VERSION $v" }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          $publicar = if ($LASTEXITCODE -eq 0) { "nao" } else { "sim" }
          $global:LASTEXITCODE = 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publicar=$publicar" >> $env:GITHUB_OUTPUT
          Write-Host "VERSION $v -> release $tag : publicar=$publicar"

      - name: Testes
        if: steps.v.outputs.publicar == 'sim'
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Gerar DriverPrecision.exe
        if: steps.v.outputs.publicar == 'sim'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.11.1
          pyinstaller --onefile --noconsole --uac-admin --name DriverPrecision --icon assets/icone.ico --add-data "assets;assets" --hidden-import driverprecision_gui --hidden-import driverprecision_abas --hidden-import driverprecision_jogos --hidden-import driverprecision_otimiza --hidden-import driverprecision_tema driverprecision.py

      - name: Montar pacotes
        if: steps.v.outputs.publicar == 'sim'
        shell: pwsh
        run: |
          $tag = "${{ steps.v.outputs.tag }}"
          New-Item -ItemType Directory -Force out, "src\DriverPrecision-$tag" | Out-Null
          Copy-Item dist\DriverPrecision.exe out\
          Copy-Item driverprecision*.py, executar.bat, README.md, LICENSE, CHANGELOG.md "src\DriverPrecision-$tag\"
          Copy-Item assets "src\DriverPrecision-$tag\assets" -Recurse
          Compress-Archive -Path "src\DriverPrecision-$tag" -DestinationPath "out\DriverPrecision-$tag.zip"
          Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii out\SHA256SUMS.txt
          Get-Content out\SHA256SUMS.txt

      - name: Notas da versão (do CHANGELOG)
        if: steps.v.outputs.publicar == 'sim'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.tag }}".TrimStart('v')
          $txt = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($txt, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)")
          $notas = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Versão $v" }
          @"
          ## Download

          - **DriverPrecision.exe** — para qualquer pessoa: dois cliques, aceite o aviso do Windows e clique em *Verificar agora*. Não precisa de Python.
          - **DriverPrecision-${{ steps.v.outputs.tag }}.zip** — código-fonte (Python 3.10+).
          - **SHA256SUMS.txt** — confira com ``Get-FileHash .\DriverPrecision.exe``.

          > O .exe não tem assinatura de código: o SmartScreen pode avisar "editor desconhecido". Clique em *Mais informações → Executar assim mesmo*. Ele é compilado por este workflow a partir do código desta tag.

          $notas
          "@ | Set-Content -Encoding utf8 notas.md

      - name: Publicar release
        if: steps.v.outputs.publicar == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.v.outputs.tag }}" out/* --target "${{ github.sha }}" --title "DriverPrecision ${{ steps.v.outputs.tag }}" --notes-file notas.md
