name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilar
        run: python -m py_compile driverprecision.py driverprecision_gui.py
      - name: Testes
        run: python -X utf8 -m unittest discover -s tests -v
      - name: CLI responde
        run: python -X utf8 driverprecision.py --version
